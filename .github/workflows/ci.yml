name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Recheck the lockfiles for new advisories every week.
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # Rust 1.100.0
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy --workspace --all-targets --locked --features persistent-partials -- -D warnings
      - name: Qualify ZIP creation on native ext-family
        if: runner.os == 'Linux'
        shell: bash
        run: |
          fixture_dir=$(mktemp -d "${RUNNER_TEMP:?}/zipfast-create.XXXXXX")
          trap 'rm -rf -- "$fixture_dir"' EXIT
          stat -f -c 'ZIP fixture filesystem: %T (%t)' "$fixture_dir"
          if [ "$(stat -f -c '%t' "$fixture_dir")" != ef53 ]; then
            printf '%s\n' 'ZIP creation qualification requires an ext-family fixture mount' >&2
            exit 1
          fi
          export TMPDIR="$fixture_dir"
          cargo test --locked --lib native_filesystem_qualification -- --nocapture
          cargo test --locked --test zip_create -- --nocapture
      - run: cargo test --workspace --all-targets --locked
      - run: cargo test --workspace --all-targets --locked --features persistent-partials
      - run: cargo test --workspace --doc --locked
      - run: cargo test --workspace --doc --locked --features persistent-partials

  sde:
    name: SHA-256 under Intel SDE (${{ matrix.cpu }})
    # GitHub's x86 runners vary. Intel's Software Development Emulator runs the SHA-256 tests on emulated CPUs with
    # known features, so the SHA-NI rounds and the portable fallback are both checked, as in par-rs and Rust's
    # stdarch CI. Sapphire Rapids has SHA-NI; Skylake client (the Coffee Lake instruction set) does not.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - cpu: spr
            expect: x86-sha-ni
          - cpu: skl
            expect: scalar
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # Rust 1.100.0
        with:
          toolchain: 1.100.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install Intel SDE
        env:
          SDE: sde-external-10.13.1-2026-07-28-lin
          SDE_SHA256: 94e97d623fec54385686e1e7ba65ebc9941748c05ee451423948334892bf2b50
        run: |
          curl --fail --silent --show-error --location \
            "https://downloadmirror.intel.com/924984/$SDE.tar.xz" -o "$RUNNER_TEMP/sde.tar.xz"
          echo "$SDE_SHA256  $RUNNER_TEMP/sde.tar.xz" | sha256sum --check --strict
          tar -xJf "$RUNNER_TEMP/sde.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$SDE" >> "$GITHUB_PATH"
      - name: Build the library tests
        run: |
          set -o pipefail
          bin=$(cargo test --locked --release --lib --no-run --message-format=json \
            | jq -r 'select(.reason == "compiler-artifact" and .profile.test) | .executable' \
            | tail -n 1)
          test -x "$bin"
          echo "TEST_BIN=$bin" >> "$GITHUB_ENV"
      - name: Run the SHA-256 tests on the emulated CPU
        run: ZIPFAST_SHA256_EXPECT=${{ matrix.expect }} sde64 -${{ matrix.cpu }} -- "$TEST_BIN" sha256
      - name: Run them again with the portable rounds forced
        run: ZIPFAST_SHA256=scalar ZIPFAST_SHA256_EXPECT=scalar sde64 -${{ matrix.cpu }} -- "$TEST_BIN" sha256

  zipview-msrv:
    name: Zipview on Rust 1.100.0
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy
      - run: cargo +1.100.0 test -p zipview --locked

  audit:
    name: Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # Rust 1.100.0
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy
      - run: cargo install cargo-audit --locked
      - run: cargo audit --file Cargo.lock
      - run: cargo audit --file crates/zipview/fuzz/Cargo.lock

  fuzz:
    name: Zipview fuzz (smoke)
    env:
      RUSTUP_TOOLCHAIN: nightly
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: crates/zipview
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # nightly
        with:
          toolchain: nightly
          components: rust-src
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            . -> target
            crates/zipview/fuzz -> target
      - run: cargo install cargo-fuzz --locked
      - run: cargo check --manifest-path fuzz/Cargo.toml --locked --bin fuzz_zip
      - run: cargo run --locked --example seedcheck
      - run: mkdir -p fuzz/corpus/fuzz_zip
      - run: cargo fuzz run fuzz_zip fuzz/corpus/fuzz_zip fuzz/seeds -- -max_total_time=120 -rss_limit_mb=4096
      - run: git diff --exit-code -- fuzz/Cargo.lock
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-artifacts
          path: crates/zipview/fuzz/artifacts/
          retention-days: 30
