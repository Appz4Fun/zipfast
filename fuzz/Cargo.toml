[package]
name = "zipfast-fuzz"
version = "0.0.0"
edition = "2024"
rust-version = "1.100"
license = "RPL-1.5"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
zipfast = { path = ".." }

[profile.release]
debug = 1
panic = "abort"
overflow-checks = true
debug-assertions = true

[[bin]]
name = "extract_rar4"
path = "fuzz_targets/extract_rar4.rs"
test = false
doc = false

[[bin]]
name = "extract_rar5"
path = "fuzz_targets/extract_rar5.rs"
test = false
doc = false

[[bin]]
name = "extract_zip"
path = "fuzz_targets/extract_zip.rs"
test = false
doc = false

[[bin]]
name = "extract_7z"
path = "fuzz_targets/extract_7z.rs"
test = false
doc = false

[[bin]]
name = "rar5_crypt_record"
path = "fuzz_targets/rar5_crypt_record.rs"
test = false
doc = false

[[bin]]
name = "progressive_rar"
path = "fuzz_targets/progressive_rar.rs"
test = false
doc = false

[[bin]]
name = "probe"
path = "fuzz_targets/probe.rs"
test = false
doc = false

[[bin]]
name = "fuzz_map_feed"
path = "fuzz_targets/fuzz_map_feed.rs"
test = false
doc = false

[[bin]]
name = "fuzz_feed_holes"
path = "fuzz_targets/fuzz_feed_holes.rs"
test = false
doc = false

# Keep the fuzz harness and its lockfile independent of the library workspace.
[workspace]
